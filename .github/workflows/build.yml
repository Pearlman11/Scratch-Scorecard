name: Build

# Two jobs, deliberately ordered cheapest-first.
#
# `kit` builds and tests ScorecardKit with plain SwiftPM: no Xcode project, no simulator, ~2 minutes.
# That is where the great majority of the code and essentially all of the difficult logic lives, so while
# the parser is still being made to compile, only the cheap job runs.
#
# `app` only runs once `kit` is green, because the app target imports ScorecardKit and cannot build until
# the package does. On a private repository GitHub bills macOS runners at 10x, so not burning a full Xcode
# build on every parser fix is worth the extra job.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run obsolete; cancelling it saves runner minutes.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: ScorecardKit (build + test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Building before testing separates "does it compile" from "do the tests pass", which are very
      # different failures and worth seeing apart.
      # `set -o pipefail` is essential: without it the pipe into `tee` returns tee's exit status and a
      # failing build or test suite reports as a green job.
      - name: Build package
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/kit-build.log

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/kit-test.log

      # Always reported, pass or fail. A green job once hid three failing tests here, because the pipe into
      # `tee` returned tee's status; printing the totals unconditionally means the outcome can be read
      # off the job summary instead of trusted.
      - name: Test totals
        if: always()
        run: |
          echo "### Test totals" >> "$GITHUB_STEP_SUMMARY"
          grep -hE "Test Suite 'All tests'|Executed [0-9]+ tests" /tmp/kit-test.log 2>/dev/null \
            | tail -2 | tee -a "$GITHUB_STEP_SUMMARY" || echo "no test output captured"

      - name: Failure summary
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -hE "error:" /tmp/kit-build.log /tmp/kit-test.log 2>/dev/null | grep -v XCTAssert | sort -u | head -80 || true
          echo "::endgroup::"
          echo "::group::Test failures"
          grep -hE "XCTAssert|XCTFail|XCTUnwrap" /tmp/kit-test.log 2>/dev/null \
            | sed 's|/Users/runner/work/Scratch-Scorecard/Scratch-Scorecard/||' | sort -u | head -80 || true
          echo "::endgroup::"

  app:
    name: iOS app (simulator build)
    runs-on: macos-15
    needs: kit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # `generic/platform=iOS Simulator` compiles for the simulator without booting one, which is both
      # faster and far less flaky than naming a specific device that may not exist on the runner image.
      # Code signing is off because this job only needs to prove the code compiles and links.
      - name: Build app
        run: |
          set -o pipefail
          # No `-arch` flag: a generic destination already implies the architecture, and passing both is
          # rejected outright ("destination implies architecture"). Building every simulator architecture
          # costs a little time and is not worth fighting for.
          xcodebuild build \
            -project GolfTracker.xcodeproj \
            -scheme GolfTracker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/app-build.log

      - name: Failure summary
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -E "error:" /tmp/app-build.log \
            | sed 's|/Users/runner/work/Scratch-Scorecard/Scratch-Scorecard/||' | sort -u | head -80 || true
          echo "::endgroup::"
